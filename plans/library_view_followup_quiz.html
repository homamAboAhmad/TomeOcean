<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أسئلة المتابعة - شاشة اختيار الكتب</title>
  <style>
    :root {
      --bg: #f7f4ee;
      --surface: #fffdf8;
      --line: #d8cfc1;
      --text: #241f18;
      --muted: #70675c;
      --accent: #0f6b78;
      --accent-soft: #dceff1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      line-height: 1.7;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 244, 238, .96);
      backdrop-filter: blur(8px);
    }
    .bar, main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
    .bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 14px 0;
    }
    h1 { margin: 0; font-size: 22px; }
    .sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .pill, section, .actions {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
    }
    .pill { padding: 6px 10px; color: var(--muted); white-space: nowrap; }
    main { padding: 18px 0 28px; }
    section { margin-bottom: 16px; overflow: hidden; }
    .group-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #f0ebe2;
      font-weight: 700;
    }
    .question { padding: 14px; border-bottom: 1px solid #eee6da; }
    .question:last-child { border-bottom: 0; }
    .q-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
    .q-num { color: var(--accent); font-weight: 700; min-width: 34px; }
    .q-title { font-weight: 650; }
    .options { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    label.option {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
      background: #fff;
    }
    label.option:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    input[type="radio"] { margin-inline-end: 6px; }
    textarea {
      width: 100%;
      min-height: 44px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
      background: #fff;
    }
    .actions {
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding: 12px;
      background: rgba(255, 253, 248, .96);
      backdrop-filter: blur(8px);
    }
    button {
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 9px 14px;
      font: inherit;
      cursor: pointer;
    }
    .primary { background: var(--accent); color: white; }
    .secondary { background: white; color: var(--accent); }
    #output { min-height: 220px; margin-top: 12px; white-space: pre-wrap; }
    .hint { color: var(--muted); font-size: 13px; }
    @media (max-width: 720px) {
      .bar { grid-template-columns: 1fr; }
      .stats { justify-content: flex-start; }
      .bar, main { width: min(100% - 18px, 1120px); }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div>
        <h1>أسئلة المتابعة قبل خطة تحويل عرض الكتب</h1>
        <p class="sub">هذه الأسئلة مبنية على فحص الكود وإجابات الكويز الأول. اختر الأقرب أو اكتب توضيحًا يدويًا.</p>
      </div>
      <div class="stats">
        <span class="pill" id="answeredCount">المجاب: 0</span>
        <span class="pill" id="manualCount">يدوي: 0</span>
        <span class="pill" id="missingCount">غير محدد: 0</span>
      </div>
    </div>
  </header>
  <main>
    <div id="quiz"></div>
    <div class="actions">
      <button class="primary" id="exportBtn">تصدير النتائج كنص</button>
      <button class="secondary" id="copyBtn">نسخ النص</button>
      <button class="secondary" id="downloadBtn">تحميل ملف txt</button>
      <button class="secondary" id="clearBtn">مسح الإجابات</button>
      <span class="hint">انسخ النص الناتج وأرسله في المحادثة.</span>
    </div>
    <textarea id="output" placeholder="ستظهر نتائج أسئلة المتابعة هنا."></textarea>
  </main>
  <script>
    const groups = [
      ["فتح الشاشة وسلوك الكتب", [
        ["q1", "زر تصفح الكتب في البار العلوي: أين يوضع؟", ["يحل محل زر القائمة الحالي", "زر جديد بجانب البحث", "زر جديد في جهة أخرى"]],
        ["q2", "عند فتح كتاب جديد وهناك كتاب مفتوح، ماذا يحدث؟", ["يستبدل الكتاب الحالي مباشرة", "يطلب تأكيدًا", "يمنع الفتح حتى يغلق الحالي"]],
        ["q3", "هل نلغي شريط تبويبات الكتب المفتوحة؟", ["نعم للكتب فقط", "لا يبقى كما هو", "يلغى كله حتى نتائج البحث"]],
        ["q4", "فتح كتاب من نتائج البحث الحالية؟", ["يستبدل الكتاب الحالي", "يفتح كتابًا جديدًا كما الآن", "يطلب تأكيدًا"]],
        ["q5", "شكل شاشة اختيار الكتب؟", ["Dialog عائم مثل الشاملة", "صفحة كاملة داخل التطبيق", "نافذة مستقلة"]],
        ["q6", "حجم الشاشة المستقلة؟", ["قريب من الشاملة", "قابل للتكبير مع حد أدنى", "يمتد حسب حجم التطبيق"]]
      ]],
      ["بطاقة الكتاب والبحث", [
        ["q7", "هل بطاقة التفاصيل السفلية مطلوبة دائمًا عند تحديد كتاب؟", ["نعم دائمًا", "تظهر بزر فقط", "لا"]],
        ["q8", "زر المجلد/بطاقة الكتاب ماذا يفعل؟", ["يفتح/يغلق اللوحة السفلية", "يفتح نافذة بطاقة مستقلة", "وظيفة أخرى"]],
        ["q9", "حقول بطاقة الكتاب النهائية؟", ["الكتاب/المؤلف/القسم/الوصف", "نضيف النوع وحالة الطبع", "أحددها يدويًا"]],
        ["q10", "في خيار البحث: ما المقصود بالبطاقة؟", ["وصف الكتاب description", "كل بيانات الكتاب", "غير ذلك"]],
        ["q11", "هل تريد التطبيع العربي في البحث؟", ["نعم", "لا", "لاحقًا"]],
        ["q12", "إن طبقنا التطبيع العربي، أين يعمل؟", ["الكتاب والمؤلف والبطاقة", "كل الحقول ومنها التصنيف", "الاسم فقط"]]
      ]],
      ["نوع الكتاب وحالة الطبع", [
        ["q13", "أنواع الكتب المطلوبة؟", ["كتب/مجلات/مخطوطات/رسائل/تعريفات", "أسماء الشاملة فقط", "قائمة مخصصة"]],
        ["q14", "حقول حالة الطبع المطلوبة؟", ["مطبوع/غير مطبوع فقط", "يوافق المطبوع أيضًا", "قائمة مخصصة"]],
        ["q15", "القيمة الافتراضية عند إضافة كتاب جديد؟", ["كتاب + غير محدد الطبع", "كتاب + مطبوع", "يجب على المستخدم الاختيار"]],
        ["q16", "الكتب القديمة بلا نوع/طبع أين تظهر؟", ["في الكتب فقط", "تظهر كغير محدد", "تخفى حتى تعدل"]],
        ["q17", "هل توافق على migration جديدة لجدول books لإضافة الحقول؟", ["نعم", "لا", "أحتاج شرحًا قبل القرار"]]
      ]],
      ["المفضلة والمؤخر والتنزيلات", [
        ["q18", "أين نخزن المفضلة والمؤخر؟", ["في SQLite", "في SharedPreferences", "الأبسط والأنسب هندسيًا"]],
        ["q19", "متى يسجل الكتاب في مؤخرًا؟", ["عند الفتح", "بعد نجاح التحميل", "عند الإغلاق"]],
        ["q20", "تبويب التنزيلات المؤجل؟", ["يظهر فارغًا", "لا يظهر الآن", "يظهر مع عبارة مؤجل"]]
      ]],
      ["المؤلفون والتصنيف والفرز", [
        ["q21", "في تبويب المؤلفين، هل نضع خانتي بحث منفصلتين؟", ["نعم", "لا", "حسب المساحة"]],
        ["q22", "اختلاف أسماء المؤلفين؟", ["تترك منفصلة", "دمج يدوي من الإدارة", "تطبيع تلقائي"]],
        ["q23", "فرز المؤلفين حسب الوفاة مع القيم الخاصة؟", ["نعم رقميًا قدر الإمكان", "حسب النص كما هو", "الوفاة ثم الاسم"]],
        ["q24", "ترتيب قيم الوفاة الخاصة؟", ["غير محدد ثم معاصر ثم السنوات", "السنوات ثم معاصر ثم غير محدد", "أكتب ترتيبًا مخصصًا"]],
        ["q25", "ترتيب التصنيفات المسطحة؟", ["حسب ترتيب الإدخال", "أبجدي", "مثل ترتيب الشاملة النهائي"]],
        ["q26", "أزرار كتب/مجلات/مخطوطات/رسائل في أعلى الشاشة؟", ["فلتر داخل تبويب الكتب", "تبويبات مستقلة", "لا تظهر"]],
        ["q27", "مطبوعات/غير مطبوعات في أعلى الشاشة؟", ["فلتر عام", "خاص بتبويب الكتب", "لا تظهر"]]
      ]],
      ["الشكل والخطة", [
        ["q28", "الأيقونات المشابهة للشاملة؟", ["أيقونات assets تشبه الشاملة", "Icons مؤقتًا", "أزودك بأيقونات لاحقًا"]],
        ["q29", "قاعدة 400 سطر مع الملفات القديمة التي سنلمسها؟", ["نفكك أي ملف نلمسه", "نلتزم فقط بالملفات الجديدة", "مرحلة لاحقة للتفكيك"]],
        ["q30", "بعد إجاباتك، كيف أوثق الخطة؟", ["ملف md فقط", "ملف md و html", "رد في المحادثة ثم ملف"]]
      ]]
    ];
    const stateKey = "goldenShamelaLibraryFollowupQuizAnswers";
    const answers = JSON.parse(localStorage.getItem(stateKey) || "{}");
    const quiz = document.getElementById("quiz");
    const output = document.getElementById("output");

    function render() {
      groups.forEach(([title, questions]) => {
        const section = document.createElement("section");
        section.innerHTML = `<div class="group-title"><span>${title}</span><span>${questions.length} أسئلة</span></div>`;
        questions.forEach(([id, text, options]) => section.appendChild(renderQuestion(id, text, options)));
        quiz.appendChild(section);
      });
      updateStats();
    }
    function renderQuestion(id, text, options) {
      const saved = answers[id] || {};
      const item = document.createElement("div");
      item.className = "question";
      item.innerHTML = `<div class="q-head"><span class="q-num">${id.replace("q", "")}</span><span class="q-title">${text}</span></div>`;
      const optionsWrap = document.createElement("div");
      optionsWrap.className = "options";
      options.forEach(option => {
        const label = document.createElement("label");
        label.className = "option";
        label.innerHTML = `<input type="radio" name="${id}" value="${escapeHtml(option)}">${option}`;
        const input = label.querySelector("input");
        input.checked = saved.choice === option;
        input.onchange = () => saveAnswer(id, option, getManual(id));
        optionsWrap.appendChild(label);
      });
      const manual = document.createElement("textarea");
      manual.id = `manual-${id}`;
      manual.placeholder = "إجابة يدوية أو توضيح إضافي...";
      manual.value = saved.manual || "";
      manual.oninput = () => saveAnswer(id, getChoice(id), manual.value);
      item.appendChild(optionsWrap);
      item.appendChild(manual);
      return item;
    }
    function saveAnswer(id, choice, manual) {
      answers[id] = { choice: choice || "", manual: manual || "" };
      localStorage.setItem(stateKey, JSON.stringify(answers));
      updateStats();
    }
    function getChoice(id) {
      const selected = document.querySelector(`input[name="${id}"]:checked`);
      return selected ? selected.value : "";
    }
    function getManual(id) {
      return document.getElementById(`manual-${id}`).value.trim();
    }
    function flatQuestions() {
      return groups.flatMap(([group, questions]) => questions.map(q => ({ group, id: q[0], text: q[1] })));
    }
    function buildText() {
      const lines = ["نتائج كويز أسئلة المتابعة لشاشة اختيار الكتب", ""];
      groups.forEach(([group, questions]) => {
        lines.push(`## ${group}`);
        questions.forEach(([id, text]) => {
          const answer = answers[id] || {};
          const choice = answer.choice ? `اختيار: ${answer.choice}` : "اختيار: غير محدد";
          const manual = answer.manual ? ` | توضيح: ${answer.manual.trim()}` : "";
          lines.push(`${id.replace("q", "")}. ${text}`);
          lines.push(`- ${choice}${manual}`);
        });
        lines.push("");
      });
      lines.push("ملاحظة: أي سؤال غير محدد يبقى مفتوحًا ولا يعتمد عليه في الخطة.");
      return lines.join("\n");
    }
    function updateStats() {
      const flat = flatQuestions();
      const answered = flat.filter(q => answers[q.id]?.choice || answers[q.id]?.manual).length;
      const manual = flat.filter(q => answers[q.id]?.manual).length;
      document.getElementById("answeredCount").textContent = `المجاب: ${answered}`;
      document.getElementById("manualCount").textContent = `يدوي: ${manual}`;
      document.getElementById("missingCount").textContent = `غير محدد: ${flat.length - answered}`;
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
    }
    document.getElementById("exportBtn").onclick = () => { output.value = buildText(); output.focus(); output.select(); };
    document.getElementById("copyBtn").onclick = async () => {
      if (!output.value) output.value = buildText();
      await navigator.clipboard.writeText(output.value);
    };
    document.getElementById("downloadBtn").onclick = () => {
      const blob = new Blob([output.value || buildText()], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "golden-shamela-library-view-followup-results.txt";
      a.click();
      URL.revokeObjectURL(a.href);
    };
    document.getElementById("clearBtn").onclick = () => {
      if (!confirm("هل تريد مسح كل الإجابات؟")) return;
      localStorage.removeItem(stateKey);
      location.reload();
    };
    render();
  </script>
</body>
</html>
