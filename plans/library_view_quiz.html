<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>كويز تحويل عرض الكتب - Golden Shamela</title>
  <style>
    :root {
      --bg: #f7f4ee;
      --surface: #fffdf8;
      --line: #d8cfc1;
      --text: #241f18;
      --muted: #70675c;
      --accent: #0f6b78;
      --accent-soft: #dceff1;
      --warn: #8a5a00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      line-height: 1.7;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 244, 238, .96);
      backdrop-filter: blur(8px);
    }
    .bar, main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 14px 0;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .pill {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--muted);
      white-space: nowrap;
    }
    main {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 18px;
      padding: 18px 0 28px;
    }
    nav {
      position: sticky;
      top: 88px;
      align-self: start;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 10px;
    }
    nav button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: right;
      padding: 9px 10px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
    }
    nav button.active, nav button:hover { background: var(--accent-soft); color: var(--accent); }
    section.group {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .group-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #f0ebe2;
      font-weight: 700;
    }
    .question { padding: 14px; border-bottom: 1px solid #eee6da; }
    .question:last-child { border-bottom: 0; }
    .q-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
    .q-num { color: var(--accent); font-weight: 700; min-width: 34px; }
    .q-title { font-weight: 650; }
    .options { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    label.option {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
      background: #fff;
    }
    label.option:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    input[type="radio"] { margin-inline-end: 6px; }
    textarea {
      width: 100%;
      min-height: 44px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
      background: #fff;
    }
    .actions {
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, .96);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      padding: 12px;
    }
    button.primary, button.secondary {
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 9px 14px;
      font: inherit;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: white; }
    button.secondary { background: white; color: var(--accent); }
    #output {
      min-height: 220px;
      margin-top: 12px;
      white-space: pre-wrap;
      direction: rtl;
    }
    .hint { color: var(--muted); font-size: 13px; }
    @media (max-width: 820px) {
      .bar, main { width: min(100% - 18px, 1180px); }
      .bar, main { grid-template-columns: 1fr; }
      nav { position: static; display: grid; grid-template-columns: repeat(2, 1fr); }
      .stats { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div>
        <h1>كويز تحويل عرض الكتب إلى نمط المكتبة الشاملة</h1>
        <p class="sub">اختر الإجابة الأقرب، واكتب إجابة يدوية عندما لا تكفي الخيارات.</p>
      </div>
      <div class="stats">
        <span class="pill" id="answeredCount">المجاب: 0</span>
        <span class="pill" id="manualCount">يدوي: 0</span>
        <span class="pill" id="missingCount">غير محدد: 0</span>
      </div>
    </div>
  </header>
  <main>
    <nav id="nav"></nav>
    <div>
      <div id="quiz"></div>
      <div class="actions">
        <button class="primary" id="exportBtn">تصدير النتائج كنص</button>
        <button class="secondary" id="copyBtn">نسخ النص</button>
        <button class="secondary" id="downloadBtn">تحميل ملف txt</button>
        <button class="secondary" id="clearBtn">مسح الإجابات</button>
        <span class="hint">النص الناتج سيظهر أسفل الأزرار ويمكن إرساله مباشرة.</span>
      </div>
      <textarea id="output" placeholder="ستظهر النتائج هنا بعد الضغط على زر التصدير."></textarea>
    </div>
  </main>
  <script>
    const groups = [
      ["مطابقة العرض", [
        ["q1", "هل المطلوب مطابقة شاشة اختيار كتاب بصريا قدر الإمكان أم استلهام أسلوبها؟", ["مطابقة قدر الإمكان", "استلهام مع تحسينات", "مؤجل للحسم"]],
        ["q2", "هل تريد شاشة مستقلة لاختيار الكتاب أم تحويل القائمة الجانبية الحالية؟", ["شاشة مستقلة", "تحويل القائمة الجانبية", "كلاهما"]],
        ["q3", "متى تظهر شاشة الاختيار؟", ["عند بدء التطبيق", "عند زر الكتب", "الاثنان"]],
        ["q4", "كيف يفتح الكتاب؟", ["نقرة واحدة", "نقرتان", "زر فتح"]],
        ["q5", "هل تريد نفس التبويبات اليمنى؟", ["نعم كلها", "بعضها فقط", "لا"]],
        ["q6", "هل تبويب التنزيلات مطلوب الآن؟", ["نعم فعلي", "شكلي فقط", "مؤجل"]],
        ["q7", "هل تريد شريط الأيقونات العلوي؟", ["نعم", "لا", "حسب الحاجة"]],
        ["q8", "هل نحافظ على القائمة الجانبية الحالية كرجوع سريع؟", ["نعم", "لا", "Feature flag"]]
      ]],
      ["البيانات", [
        ["q9", "ما مصدر قائمة الكتب الذي نعتمد عليه؟", ["ملفات docx", "الكاش/metadata", "كلاهما"]],
        ["q10", "هل كل كتاب يحتوي الحقول الأساسية؟", ["نعم", "لا", "غير متأكد"]],
        ["q11", "من أين تأتي التصنيفات؟", ["metadata", "استخراج", "إدخال يدوي"]],
        ["q12", "هل المؤلف حقل مستقل؟", ["نعم", "لا", "غير متأكد"]],
        ["q13", "هل بيانات الوفاة موجودة؟", ["نعم", "لا", "لاحقا"]],
        ["q14", "هل عدد كتب المؤلف مطلوب؟", ["نعم", "لا", "لاحقا"]],
        ["q15", "هل عدد كتب التصنيف مطلوب؟", ["نعم", "لا", "لاحقا"]],
        ["q16", "هل نحتاج أنواع: كتاب/مجلة/مخطوط/رسالة؟", ["نعم", "لا", "لاحقا"]],
        ["q17", "هل نحتاج مطبوعات/غير مطبوعات؟", ["نعم", "لا", "لاحقا"]],
        ["q18", "هل تظهر الكتب قيد المعالجة أو غير المكتملة؟", ["تظهر", "تخفى", "تظهر بتحذير"]]
      ]],
      ["البحث", [
        ["q19", "نطاق البحث؟", ["اسم الكتاب فقط", "الكتاب والمؤلف", "كل الحقول"]],
        ["q20", "هل البحث فوري أثناء الكتابة؟", ["نعم", "لا", "بعد Enter"]],
        ["q21", "هل نطبق التطبيع العربي؟", ["نعم", "لا", "لاحقا"]],
        ["q22", "هل البحث داخل التبويب/التصنيف المحدد فقط؟", ["داخل المحدد", "كل المكتبة", "خيار قابل للتبديل"]],
        ["q23", "في تبويب المؤلفين، يبحث الصندوق في ماذا؟", ["المؤلفين فقط", "الكتب فقط", "المؤلفين والكتب"]],
        ["q24", "هل نميز النص المطابق؟", ["نعم", "لا", "لاحقا"]],
        ["q25", "ترتيب نتائج البحث؟", ["حسب التطابق", "أبجدي", "آخر استخدام"]]
      ]],
      ["التصنيف", [
        ["q26", "هل شاشة التصنيف تكون مقسومة كالصورة؟", ["نعم", "لا", "لاحقا"]],
        ["q27", "هل التصنيفات مسطحة أم شجرية؟", ["مسطحة", "شجرية", "غير متأكد"]],
        ["q28", "هل يظهر عدد الكتب بجانب التصنيف؟", ["نعم", "لا", "لاحقا"]],
        ["q29", "أين تظهر كتب التصنيف؟", ["نفس الشاشة", "لوحة منفصلة", "صفحة منفصلة"]],
        ["q30", "هل نضيف خيار كل الكتب؟", ["نعم", "لا", "لاحقا"]]
      ]],
      ["المؤلفون", [
        ["q31", "هل المؤلفون قائمة ثم كتب المؤلف بلوحة أخرى؟", ["نعم", "لا", "لاحقا"]],
        ["q32", "ترتيب المؤلفين؟", ["حسب الاسم", "حسب الوفاة", "حسب عدد الكتب"]],
        ["q33", "المؤلف المجهول؟", ["يظهر كمجهول", "يخفى", "يجمع في قسم خاص"]],
        ["q34", "اختلافات أسماء المؤلفين؟", ["تعرض منفصلة", "دمج يدوي", "قواعد تطبيع"]]
      ]],
      ["المفضلة والمؤخر", [
        ["q35", "هل المفضلة موجودة حاليا؟", ["نعم", "لا", "غير متأكد"]],
        ["q36", "مستوى المفضلة؟", ["كتاب فقط", "كتاب وموضع", "كلاهما"]],
        ["q37", "مؤخرا يعني ماذا؟", ["آخر الكتب", "آخر مواضع القراءة", "كلاهما"]],
        ["q38", "كم عنصر في مؤخرا؟", ["10", "20", "50"]],
        ["q39", "هل حذف عنصر من مؤخرا مطلوب؟", ["نعم", "لا", "لاحقا"]],
        ["q40", "هل تثبيت المفضلة أعلى القائمة مطلوب؟", ["نعم", "لا", "لاحقا"]]
      ]],
      ["الشكل والتجربة", [
        ["q41", "الأيقونات؟", ["مشابهة جدا للشاملة", "جديدة بنفس الدلالة", "بدون أولوية"]],
        ["q42", "طابع الواجهة؟", ["كلاسيكي مثل الصور", "أنظف مع نفس البنية", "حديث أكثر"]],
        ["q43", "الخطوط والأحجام؟", ["قريبة من الصور", "حسب نظام التطبيق", "تحتاج تجربة"]],
        ["q44", "ألوان التحديد والجانب؟", ["مطابقة", "قريبة", "حسب ثيم التطبيق"]],
        ["q45", "نطاق الشاشات؟", ["ويندوز سطح مكتب فقط", "كل المقاسات", "سطح مكتب مع مرونة"]],
        ["q46", "تغيير حجم النافذة؟", ["مطلوب", "غير مهم", "لاحقا"]],
        ["q47", "تغيير عرض الأعمدة بالسحب؟", ["نعم", "لا", "لاحقا"]],
        ["q48", "رؤوس الأعمدة؟", ["نعم مثل الصورة", "نعم بتعديل", "لا"]],
        ["q49", "أيقونة كتاب بجانب كل كتاب؟", ["نعم", "لا", "لاحقا"]],
        ["q50", "شريط تمرير داخلي لكل لوحة؟", ["نعم", "لا", "حسب التصميم"]]
      ]],
      ["داخل القارئ", [
        ["q51", "بعد اختيار كتاب، ماذا يحدث؟", ["تغلق الشاشة ويفتح الكتاب", "تبقى الشاشة", "يفتح في تبويب/لوحة"]],
        ["q52", "هل نحتاج زر عودة لشاشة الاختيار؟", ["نعم", "لا", "لاحقا"]],
        ["q53", "هل يحفظ موضع الكتاب السابق؟", ["نعم", "لا", "لاحقا"]],
        ["q54", "فتح أكثر من كتاب؟", ["كتاب واحد", "أكثر من كتاب لاحقا", "أكثر من كتاب الآن"]],
        ["q55", "إظهار بيانات الكتاب في العنوان؟", ["نعم", "لا", "لاحقا"]]
      ]],
      ["الإدارة والإعدادات", [
        ["q56", "زر المجلد يعني ماذا؟", ["إضافة/استيراد كتاب", "فتح مجلد المكتبة", "غير مطلوب"]],
        ["q57", "زر الإعدادات؟", ["له شاشة محددة", "مؤجل", "إخفاؤه حاليا"]],
        ["q58", "زر إعادة فهرسة؟", ["نعم", "لا", "لاحقا"]],
        ["q59", "الكتب غير الصالحة؟", ["تخفى", "تظهر بتحذير", "قسم خاص"]],
        ["q60", "قائمة كليك يمين/معلومات كتاب؟", ["نعم", "لا", "لاحقا"]]
      ]],
      ["الأداء والهندسة", [
        ["q61", "عدد الكتب المتوقع؟", ["أقل من 1000", "1000-10000", "أكثر من 10000"]],
        ["q62", "تحميل الشاشة؟", ["فوري ثم تحميل تدريجي", "انتظار الفهرس", "حسب الأداء"]],
        ["q63", "هل نسمح بفهرس metadata جديد؟", ["نعم", "لا", "بعد موافقة منفصلة"]],
        ["q64", "هل نحتاج feature flag؟", ["نعم", "لا", "يفضل"]],
        ["q65", "هل نحتفظ بالقائمة الحالية حتى تكتمل الجديدة؟", ["نعم", "لا", "Feature flag"]],
        ["q66", "هل ممنوع المساس بمسارات المعالجة والكاش؟", ["نعم", "لا", "مسموح بتحفظ"]],
        ["q67", "بعد الكويز، ما الخطوة التالية؟", ["خطة فقط", "فحص الكود ثم خطة", "خطة ثم تنفيذ"]]
      ]],
      ["معايير القبول", [
        ["q68", "ما الصورة المرجع الأساسي؟", ["الأولى", "الثانية", "الثالثة"]],
        ["q69", "هل يجب أن تنجح على مكتبة فارغة؟", ["نعم", "لا", "لاحقا"]],
        ["q70", "أسماء الأقسام النهائية؟", ["مثل الشاملة", "أسماء مخصصة", "تحدد لاحقا"]],
        ["q71", "أين توثق الخطة؟", ["في المحادثة فقط", "ملف داخل المشروع", "الاثنان"]],
        ["q72", "أول نسخة مقبولة؟", ["تبويب الكتب فقط", "كل التبويبات الأساسية", "كل شيء دفعة واحدة"]]
      ]]
    ];
    const stateKey = "goldenShamelaLibraryQuizAnswers";
    const answers = JSON.parse(localStorage.getItem(stateKey) || "{}");
    const quiz = document.getElementById("quiz");
    const nav = document.getElementById("nav");
    const output = document.getElementById("output");
    function render() {
      groups.forEach(([title, questions], groupIndex) => {
        const navBtn = document.createElement("button");
        navBtn.textContent = title;
        navBtn.onclick = () => document.getElementById(`group-${groupIndex}`).scrollIntoView({ behavior: "smooth" });
        nav.appendChild(navBtn);

        const section = document.createElement("section");
        section.className = "group";
        section.id = `group-${groupIndex}`;
        section.innerHTML = `<div class="group-title"><span>${title}</span><span>${questions.length} أسئلة</span></div>`;
        questions.forEach(([id, text, options]) => section.appendChild(renderQuestion(id, text, options)));
        quiz.appendChild(section);
      });
      updateStats();
    }
    function renderQuestion(id, text, options) {
      const saved = answers[id] || {};
      const item = document.createElement("div");
      item.className = "question";
      const num = id.replace("q", "");
      item.innerHTML = `<div class="q-head"><span class="q-num">${num}</span><span class="q-title">${text}</span></div>`;
      const optionsWrap = document.createElement("div");
      optionsWrap.className = "options";
      options.forEach(option => {
        const label = document.createElement("label");
        label.className = "option";
        label.innerHTML = `<input type="radio" name="${id}" value="${escapeHtml(option)}">${option}`;
        const input = label.querySelector("input");
        input.checked = saved.choice === option;
        input.onchange = () => saveAnswer(id, option, getManual(id));
        optionsWrap.appendChild(label);
      });
      const manual = document.createElement("textarea");
      manual.id = `manual-${id}`;
      manual.placeholder = "إجابة يدوية أو توضيح إضافي...";
      manual.value = saved.manual || "";
      manual.oninput = () => saveAnswer(id, getChoice(id), manual.value);
      item.appendChild(optionsWrap);
      item.appendChild(manual);
      return item;
    }
    function saveAnswer(id, choice, manual) {
      answers[id] = { choice: choice || "", manual: manual || "" };
      localStorage.setItem(stateKey, JSON.stringify(answers));
      updateStats();
    }
    function getChoice(id) {
      const selected = document.querySelector(`input[name="${id}"]:checked`);
      return selected ? selected.value : "";
    }
    function getManual(id) {
      return document.getElementById(`manual-${id}`).value.trim();
    }
    function getFlatQuestions() {
      return groups.flatMap(([group, questions]) => questions.map(q => ({ group, id: q[0], text: q[1] })));
    }
    function buildText() {
      const lines = ["نتائج كويز تحويل عرض الكتب إلى نمط المكتبة الشاملة", ""];
      groups.forEach(([group, questions]) => {
        lines.push(`## ${group}`);
        questions.forEach(([id, text]) => {
          const answer = answers[id] || {};
          const choice = answer.choice ? `اختيار: ${answer.choice}` : "اختيار: غير محدد";
          const manual = answer.manual ? ` | توضيح: ${answer.manual.trim()}` : "";
          lines.push(`${id.replace("q", "")}. ${text}`);
          lines.push(`- ${choice}${manual}`);
        });
        lines.push("");
      });
      lines.push("ملاحظة: أي سؤال غير محدد يبقى مفتوحا ولا يعتمد عليه في الخطة إلا بعد توضيح.");
      return lines.join("\n");
    }
    function updateStats() {
      const flat = getFlatQuestions();
      const answered = flat.filter(q => (answers[q.id]?.choice || answers[q.id]?.manual)).length;
      const manual = flat.filter(q => answers[q.id]?.manual).length;
      document.getElementById("answeredCount").textContent = `المجاب: ${answered}`;
      document.getElementById("manualCount").textContent = `يدوي: ${manual}`;
      document.getElementById("missingCount").textContent = `غير محدد: ${flat.length - answered}`;
    }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
    }
    document.getElementById("exportBtn").onclick = () => { output.value = buildText(); output.focus(); output.select(); };
    document.getElementById("copyBtn").onclick = async () => {
      if (!output.value) output.value = buildText();
      await navigator.clipboard.writeText(output.value);
    };
    document.getElementById("downloadBtn").onclick = () => {
      const blob = new Blob([output.value || buildText()], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "golden-shamela-library-view-quiz-results.txt";
      a.click();
      URL.revokeObjectURL(a.href);
    };
    document.getElementById("clearBtn").onclick = () => {
      if (!confirm("هل تريد مسح كل الإجابات؟")) return;
      localStorage.removeItem(stateKey);
      location.reload();
    };

    render();
  </script>
</body>
</html>
